# CI —— 持续集成：每次 push / PR 到 main 时在三大平台编译并测试
#
# 设计要点：
#   * matrix 覆盖 Linux / Windows / macOS，确保跨平台始终可编译可测。
#   * 所有 cargo 命令一律带 --locked：严格按 Cargo.lock 锁定的依赖版本构建，
#     CI 上若有人忘记提交 lock 变更会直接失败，避免“在我机器上能过”。
#   * 仅 Linux 需要 apt 安装一堆系统库（GTK/X11/Wayland/appindicator/xdo/openssl）；
#     Windows 用 MSVC、macOS 用系统框架，均无需额外系统依赖。
#   * 仅在 ubuntu 上跑 clippy（-D warnings），避免三平台重复跑拖慢 CI；不强制 cargo fmt。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支/PR 的新推送会取消尚在排队或运行中的旧 CI，省额度也更快出结果。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # 一个平台挂掉不连累其它平台，方便一次看全所有平台的问题
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy # clippy 只在 ubuntu 用，但装上无害且不增加可观开销

      # 缓存 ~/.cargo 与 target，跨 run 复用编译产物，大幅缩短后续 CI 时间。
      # 自动按 os + lock 哈希分桶，无需手动配置 key。
      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # 仅 Linux 需要这些系统开发库（Windows/macOS 跳过本步）：
      #   依赖树来源 ——
      #     rfd(原生文件对话框)            -> GTK3
      #     tray-icon(系统托盘)            -> libayatana-appindicator3 + libxdo
      #     eframe/egui(窗口与 GL 上下文)  -> X11 / Wayland / xkbcommon / mesa GL
      #     ureq(tls 特性)                 -> 走 rustls 一般不强依赖系统 openssl，
      #                                       但保留 libssl-dev + pkg-config 兜底更稳
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            pkg-config \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Build (release, locked)
        run: cargo build --release --locked

      # 只跑默认（非 #[ignore]）测试 —— 即纯本地单元测试。
      # 绝不加 -- --ignored：那些是真实网络 e2e（README 写明会打 Civitai / HuggingFace），
      # CI 跑会依赖外网且极易 flaky（域名被墙/限流/对端 schema 变动），故在 CI 永久排除。
      - name: Test (release, locked)
        run: cargo test --release --locked

      # clippy 仅在 ubuntu 跑一次即可（lint 与平台基本无关），把告警当错误，保证代码整洁。
      - name: Clippy (deny warnings)
        if: runner.os == 'Linux'
        run: cargo clippy --release --locked -- -D warnings
