[package]
name = "comfy-downloader"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
egui_extras = { version = "0.29", features = ["http", "file", "image"] }
image = { version = "0.25", features = ["jpeg", "png", "webp"] }
ureq = { version = "2", default-features = false, features = ["tls", "proxy-from-env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
rfd = "0.15"
notify-rust = "4"
tray-icon = "0.19"
raw-window-handle = "0.6"

[profile.release]
opt-level = 2
strip = true
